name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

        # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships with an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install --no-audit --no-fund

        # Verify the tag matches package.json version, fail fast otherwise.
      - name: Check version match
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance
